<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8A5A3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Slektsboka">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Slektsboka</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,400..600&family=Schibsted+Grotesk:wght@400..800&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* Layout: toppnavigasjon på bred skjerm, fast tabellinje nederst på telefon.
   Kartsiden er det eneste stedet med kraftig typografi (årstallet). */
:root{
  --bg:#ECECE8; --surface:#F8F8F5; --surface-2:#E3E3DD; --ink:#1E2B36; --ink-2:#556470; --ink-3:#85939C;
  --line:#D6D6CF; --line-2:#BDBDB4; --accent:#8A5A3C; --accent-ink:#FFFFFF; --accent-soft:#EBDFD5;
  --teal:#4A6C86; --gold:#B08A4A; --danger:#B3261E;
  --sea:#D5E0E8; --land:#F5F3EC; --coast:#A3B3BF; --border:#BAC4CB; --kom:#D3D5CE; --county:#9CA9B2;
  --f0:#87939C; --f1:#8A5A3C; --f2:#4A6C86; --f3:#B89466; --f4:#2F4A63; --f5:#8DA3B6; --f6:#5E4636;
  --shadow:0 1px 2px rgba(30,43,54,.08),0 10px 28px rgba(30,43,54,.12);
  --display:'Newsreader',Georgia,'Times New Roman',serif;
  --ui:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav-h:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11181D;--surface:#182229;--surface-2:#202C34;--ink:#E9E6E0;--ink-2:#AEB6B8;--ink-3:#7F8E94;--line:#2A3944;--line-2:#3B4C58;--accent:#D3A27E;--accent-ink:#241710;--accent-soft:#3A2E26;--teal:#8FB0CC;--gold:#E0BE7E;--danger:#F2877F;--sea:#0C1419;--land:#1B2830;--coast:#44586A;--border:#3C4F5E;--kom:#26343E;--county:#5B7080;--f0:#8D9AA1;--f1:#D3A27E;--f2:#8FB0CC;--f3:#E0C08F;--f4:#6F95B8;--f5:#B9876A;--f6:#A9BDD0;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11181D;--surface:#182229;--surface-2:#202C34;--ink:#E9E6E0;--ink-2:#AEB6B8;--ink-3:#7F8E94;--line:#2A3944;--line-2:#3B4C58;--accent:#D3A27E;--accent-ink:#241710;--accent-soft:#3A2E26;--teal:#8FB0CC;--gold:#E0BE7E;--danger:#F2877F;--sea:#0C1419;--land:#1B2830;--coast:#44586A;--border:#3C4F5E;--kom:#26343E;--county:#5B7080;--f0:#8D9AA1;--f1:#D3A27E;--f2:#8FB0CC;--f3:#E0C08F;--f4:#6F95B8;--f5:#B9876A;--f6:#A9BDD0;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
p{margin:0}
.ico{display:inline-flex;vertical-align:middle;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

#app{padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto;min-height:100vh;min-height:100svh}
.top{display:flex;align-items:center;gap:20px;padding-block:14px 10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;margin-right:auto;font-variation-settings:'opsz' 48}
.brand small{font-family:var(--ui);font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.tab{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,42,48,.12)}
.tab:hover{color:var(--ink)}
main{padding-block:10px 56px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--line-2);border-radius:12px;padding:10px 14px;margin-block:6px;font-size:14px}
.banner b{font-weight:600}

@media (max-width:759px){
  .top{padding-block:12px 4px}
  .brand{font-size:23px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));justify-content:space-between;gap:2px;box-shadow:0 -6px 20px rgba(20,42,48,.08)}
  .tab{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:11.5px;min-width:0}
  .tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:none}
  main{padding-bottom:calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
}

/* knapper og felt */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:9px 15px;border-radius:10px;font-weight:600;font-size:14px;line-height:1.2;min-height:40px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.danger.sure{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:5px 11px;min-height:32px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);flex:none}
.icon-btn:hover{border-color:var(--ink-3)}
.seg{display:inline-flex;background:var(--surface-2);padding:3px;border-radius:10px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,42,48,.14)}
.inp{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:42px;font-size:15px}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
select.inp{appearance:auto}
.lbl{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 12px 3px 4px;font-size:13.5px;font-weight:500;text-decoration:none;max-width:100%}
.chip:hover{border-color:var(--ink-3)}
.chip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip.plain{padding:4px 12px}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* avatar */
.av{position:relative;flex:none;width:var(--s,40px);height:var(--s,40px);border-radius:max(3px,calc(var(--s,40px)*.09));overflow:hidden;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:calc(var(--s,40px)*.4);border:1px solid var(--line)}
.av img{position:absolute;max-width:none;display:block}

/* register */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-block:14px 16px}
.page-h h1{font-family:var(--display);font-size:clamp(28px,4.5vw,40px);letter-spacing:-.015em;line-height:1.1}
.page-h p{color:var(--ink-2);margin-top:4px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools .grow{flex:1 1 220px;position:relative;min-width:0}
.tools .grow .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.tools .grow input{padding-left:40px}
.people{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px}
.prow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;min-width:0}
.prow:hover{border-color:var(--ink-3);box-shadow:var(--shadow)}
.prow .b{min-width:0;flex:1}
.prow .n{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .s{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .y{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);text-align:right;white-space:nowrap}
.empty{border:1.5px dashed var(--line-2);border-radius:16px;padding:36px 20px;text-align:center;color:var(--ink-2);display:grid;gap:12px;justify-items:center}
.empty h2{font-family:var(--display);font-size:24px;color:var(--ink)}
.empty p{max-width:46ch}

/* personside */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink-2);font-weight:600;padding:6px 0;font-size:14px}
.back:hover{color:var(--ink)}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-block:6px 18px}
.hero .id{flex:1 1 260px;min-width:0}
.hero h1{font-family:var(--display);font-size:clamp(30px,6vw,46px);line-height:1.05;letter-spacing:-.02em;font-weight:600;overflow-wrap:anywhere}
.hero .life{font-size:17px;color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card h2{font-family:var(--display);font-size:22px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:grid;gap:16px;align-content:start;min-width:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0}
.facts dt{color:var(--ink-3);font-size:13px;font-weight:600;padding-top:1px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.fam{display:grid;gap:14px}
.fam h3{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.life-list{list-style:none;margin:0;padding:0;display:grid;gap:0}
.life-list li{display:grid;grid-template-columns:56px 14px minmax(0,1fr);gap:8px;align-items:start;padding-block:7px;position:relative}
.life-list .yr{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);text-align:right;font-size:14px;padding-top:1px}
.life-list .dot{width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);margin:7px auto 0;position:relative;z-index:1}
.life-list li::before{content:"";position:absolute;left:calc(56px + 8px + 6.5px);top:0;bottom:0;width:1.5px;background:var(--line)}
.life-list li:first-child::before{top:18px}
.life-list li:last-child::before{bottom:calc(100% - 18px)}
.life-list li:only-child::before{display:none}
.life-list .k{font-size:13px;color:var(--ink-3)}
.life-list .dot.kid{border-color:var(--teal)}
.life-list .dot.sm{border-color:var(--ink-3)}
.mini{height:min(300px,52vw);min-height:220px;position:relative;border-radius:12px;overflow:hidden;background:var(--sea);border:1px solid var(--line)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:12px;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.65));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb .tg{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;font-size:11.5px;padding:1px 8px;display:flex;gap:4px;align-items:center}
.notes{white-space:pre-wrap;overflow-wrap:anywhere}

/* modal */
.modal-back{position:fixed;inset:0;z-index:50;background:rgba(8,18,22,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:760px){.modal-back{align-items:center;padding:24px}}
.modal{background:var(--bg);color:var(--ink);width:100%;max-width:680px;max-height:94vh;max-height:94svh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;box-shadow:var(--shadow);overflow:hidden}
@media (min-width:760px){.modal{border-radius:18px}}
.modal.wide{max-width:1000px}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.modal-h h2{font-family:var(--display);font-size:22px;font-weight:600}
.modal-b{padding:18px;overflow:auto;overscroll-behavior:contain;display:grid;gap:16px;align-content:start;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid .half-m{grid-column:1/-1}}
.fs{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px;display:grid;gap:12px;min-width:0}
.fs>h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.rowline{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;align-items:start}
.rowline.p3{grid-template-columns:minmax(0,1fr) 90px auto}
.pf{position:relative;min-width:0}
.pf .st{font-size:12.5px;color:var(--ink-3);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pf .st.ok{color:var(--teal)}
.ac{position:absolute;left:0;right:0;top:calc(100% - 2px);z-index:30;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);list-style:none;margin:6px 0 0;padding:4px;max-height:240px;overflow:auto}
.ac li{padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.ac li[aria-selected="true"],.ac li:hover{background:var(--accent-soft)}
.ac li small{color:var(--ink-3);white-space:nowrap}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:12px;margin-bottom:-6px;border-top:1px solid var(--line)}
.pick{position:relative;height:min(58vh,520px);border-radius:12px;overflow:hidden;background:var(--sea);border:1px solid var(--line);touch-action:none}
.pick .pin{position:absolute;width:22px;height:22px;margin:-22px 0 0 -11px;pointer-events:none}
.pick .hint{position:absolute;left:10px;top:10px;right:10px;pointer-events:none;display:flex;justify-content:space-between;gap:8px}
.pick .hint span{background:color-mix(in srgb,var(--surface) 88%,transparent);padding:4px 10px;border-radius:999px;font-size:12.5px;border:1px solid var(--line)}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:min(92vw,520px);text-align:center}
@media (min-width:760px){.toast{bottom:28px}}

/* kart */
.mapwrap{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line-2);background:var(--sea);height:clamp(380px,66vh,760px);height:clamp(380px,66svh,760px)}
.basemap{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
.basemap:active{cursor:grabbing}
.basemap path{vector-effect:non-scaling-stroke;stroke-linejoin:round}
.basemap .p-land{fill:var(--land);stroke:var(--coast);stroke-width:.6}
.basemap .p-coast{fill:none;stroke:var(--coast);stroke-width:.6}
.basemap .p-border{fill:none;stroke:var(--border);stroke-width:.6;stroke-dasharray:3 2}
.basemap .p-kland{fill:var(--land);stroke:var(--land);stroke-width:1}
.basemap .p-kom{fill:none;stroke:var(--kom);stroke-width:.6}
.basemap .p-county{fill:none;stroke:var(--county);stroke-width:.8}
.basemap .p-route{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4;stroke-linecap:round}
.dots{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.dot{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;transition:transform var(--mv,.7s) cubic-bezier(.4,.1,.2,1)}
.dots.instant .dot{transition:none}
.dot i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--c,var(--accent));border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:auto;cursor:pointer;transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .35s;transform:scale(1)}
.dot.enter i{transform:scale(0);opacity:0}
.dot.gone i{transform:scale(0);opacity:0}
.dot.sel i{transform:scale(1.5);border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 35%,transparent)}
.dot:hover i{transform:scale(1.35)}
.dot.enter:hover i,.dot.gone:hover i{transform:scale(0)}
.plabel{position:absolute;left:0;top:0;transform:translate(var(--x),var(--y));font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;pointer-events:none;text-shadow:0 0 3px var(--sea),0 0 3px var(--sea),0 0 6px var(--sea)}
.plabel b{font-weight:700;color:var(--accent)}
.yearbox{position:absolute;left:14px;top:8px;pointer-events:none;z-index:2}
.yearbox .yr{font-family:var(--display);font-weight:300;font-size:clamp(56px,13vw,112px);line-height:.95;letter-spacing:-.04em;font-variant-numeric:lining-nums tabular-nums;font-variation-settings:'opsz' 72;color:var(--ink);text-shadow:0 0 14px var(--sea),0 0 14px var(--sea)}
.yearbox .meta{font-size:13.5px;font-weight:600;color:var(--ink-2);text-shadow:0 0 8px var(--sea),0 0 8px var(--sea);margin-top:4px}
.mapctl{position:absolute;right:12px;top:12px;display:grid;gap:6px;z-index:3}
.mapctl .icon-btn{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(4px)}
.info{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:grid;gap:8px;max-width:520px}
.info .hd{display:flex;gap:12px;align-items:center}
.info .nm{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.15}
.info .route{font-size:13px;color:var(--ink-2);max-height:4.6em;overflow:auto}
.info .acts{display:flex;gap:8px;flex-wrap:wrap}
.nodata{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:2}
.nodata div{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:18px 20px;max-width:380px;box-shadow:var(--shadow);display:grid;gap:6px}
.nodata h2{font-family:var(--display);font-size:20px}
.player{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin-top:12px}
.play{width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.play:hover{filter:brightness(1.08)}
.scrub{position:relative;height:56px;min-width:0}
.scrub svg.spark{position:absolute;left:0;right:0;top:0;width:100%;height:36px}
.spark .area{fill:color-mix(in srgb,var(--accent) 22%,transparent);stroke:var(--accent);stroke-width:1.2;vector-effect:non-scaling-stroke}
.spark .base{stroke:var(--line-2);stroke-width:1;vector-effect:non-scaling-stroke}
.scrub input[type=range]{position:absolute;left:0;right:0;top:12px;width:100%;margin:0;height:28px;background:transparent;-webkit-appearance:none;appearance:none}
.scrub input[type=range]::-webkit-slider-runnable-track{height:2px;background:transparent}
.scrub input[type=range]::-moz-range-track{height:2px;background:transparent}
.scrub input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-top:-10px;box-shadow:var(--shadow)}
.scrub input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.scrub .axis{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.scrub .cursor{position:absolute;top:0;height:36px;width:2px;background:var(--accent);pointer-events:none;transform:translateX(-1px)}
.maprow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:12px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:500}
.legend button i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.legend button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.fnote{font-size:12.5px;color:var(--ink-3);margin-top:10px}

/* tre */
.treewrap{position:relative;border:1px solid var(--line-2);border-radius:18px;background:var(--surface);overflow:hidden;height:clamp(420px,70vh,820px);height:clamp(420px,70svh,820px);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.treewrap svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.edge{fill:none;stroke:var(--line-2);stroke-width:1.6}
.edge.hl{stroke:var(--accent);stroke-width:2.4}
.union{fill:var(--ink-3)}
.pcard{width:100%;height:100%;display:flex;align-items:center;gap:9px;padding:0 10px 0 8px;background:var(--surface);border:1px solid var(--line-2);border-left:4px solid var(--line-2);border-radius:12px;box-shadow:0 1px 2px rgba(20,42,48,.08);cursor:pointer;overflow:hidden;min-width:0}
.pcard.sel{outline:3px solid var(--gold);outline-offset:1px}
.pcard .b{min-width:0;flex:1}
.pcard .n{font-family:var(--display);font-weight:600;font-size:14.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .sb{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.pcard .y{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.treebar{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:620px}
.treebar .nm{font-family:var(--display);font-weight:600;font-size:18px}
.treectl{position:absolute;right:12px;top:12px;display:grid;gap:6px;z-index:3}

/* bilder */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.gal .thumb{aspect-ratio:4/5}
.pv{display:grid;gap:14px;min-width:0}
.pvstage{position:relative;display:grid;place-items:center;background:var(--surface-2);border-radius:12px;padding:8px;min-height:200px}
.pvwrap{position:relative;display:inline-block;line-height:0;max-width:100%}
.pvwrap img{display:block;max-width:100%;max-height:min(62vh,640px);width:auto;height:auto;border-radius:6px}
.pvwrap.tagging{cursor:crosshair;outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.pin{position:absolute;transform:translate(-50%,-8px);line-height:1.2;pointer-events:none}
.pin i{display:block;width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;background:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.5);margin:0 auto;pointer-events:auto}
.pin.pending i{background:var(--gold);animation:pulse 1.2s infinite}
.pin span{display:block;margin-top:4px;background:rgba(10,20,24,.82);color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.35;pointer-events:auto}
.pvwrap.nonames .pin span{display:none}
.pvwrap.nonames .pin:hover span{display:block;position:relative;z-index:3}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(185,133,42,.28)}}
.pvside{display:grid;gap:12px}
.pvnav{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chooser{border:1px solid var(--gold);border-radius:12px;padding:12px;background:var(--surface);display:grid;gap:8px}
.chooser ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:210px;overflow:auto}
.chooser li button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:5px 6px;border-radius:8px;text-align:left}
.chooser li button:hover{background:var(--accent-soft)}
.tagchips{display:flex;gap:6px;flex-wrap:wrap}
.tagchips .chip button{border:0;background:none;padding:0 0 0 2px;color:var(--ink-3);display:inline-flex}
.tagchips .chip button:hover{color:var(--danger)}
.uploading{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}

@media (prefers-reduced-motion:reduce){
  .dot,.dot i{transition:none!important}
  .pin.pending i{animation:none}
}

.mmpin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:none}
.pick .pin{transform:none}

.badge{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:999px;align-self:flex-start;white-space:nowrap}
.thumb .badge.top{position:absolute;left:6px;top:6px;background:rgba(20,28,34,.72);color:#fff}
.thumb.doc img{object-fit:cover;object-position:top}
.srclist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.srcrow{width:100%;display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px;min-width:0}
.srcrow:hover{border-color:var(--ink-3)}
.srcrow img{width:56px;height:68px;object-fit:cover;object-position:top;border-radius:6px;flex:none;background:var(--surface-2)}
.srcrow .b{display:grid;gap:3px;min-width:0;flex:1}
.srcrow .n{font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.pvstage.big{overflow:auto;max-height:72vh;place-items:start}
.pvwrap.big img{max-width:none;max-height:none;width:auto}
.page-h+.seg{margin-bottom:14px}
.pfield{display:flex;gap:6px;align-items:center}
.pf-btn{display:flex;align-items:center;gap:8px;text-align:left;cursor:pointer;flex:1;min-width:0}
.pf-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pk-list{display:grid;gap:6px;align-content:start}
.pk-h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:10px 0 2px}
.pk-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:6px 10px;min-height:48px;cursor:pointer;color:var(--ink)}
.pk-row:hover{border-color:var(--ink-3)}
.pk-t{display:grid;min-width:0}
.pk-s{font-size:12.5px}

.crop{display:grid;gap:12px;justify-items:center}
.crop-stage{position:relative;width:min(100%,340px);aspect-ratio:1;overflow:hidden;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);touch-action:none;cursor:grab}
.crop-stage:active{cursor:grabbing}
.crop-stage img{position:absolute;max-width:none;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.crop-grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent 33.2%,rgba(255,255,255,.45) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.45) 66.7%,transparent 66.8%),linear-gradient(to bottom,transparent 33.2%,rgba(255,255,255,.45) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.45) 66.7%,transparent 66.8%)}
.crop-row{display:flex;gap:14px;align-items:center;width:min(100%,340px)}
.crop-row input[type=range]{flex:1;min-width:0}
.crop-thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;width:100%}
.crop-thumbs button{flex:none;width:64px;height:64px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--surface-2);cursor:pointer}
.crop-thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.crop-thumbs img{width:100%;height:100%;object-fit:cover;display:block}

.cr-wrap{position:relative;max-width:100%;touch-action:none;user-select:none;margin:13px}
.cr-clip{position:absolute;inset:0;overflow:hidden;border-radius:6px;background:var(--surface-2)}
.cr-shade{position:absolute;box-shadow:0 0 0 9999px rgba(15,20,24,.58);pointer-events:none}
.cr-wrap img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.cr-box{position:absolute;border:2px solid #fff;cursor:move;outline:1px solid rgba(0,0,0,.35)}
.cr-grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent calc(33.3% - .5px),rgba(255,255,255,.5) 33.3%,transparent calc(33.3% + .5px),transparent calc(66.6% - .5px),rgba(255,255,255,.5) 66.6%,transparent calc(66.6% + .5px)),linear-gradient(to bottom,transparent calc(33.3% - .5px),rgba(255,255,255,.5) 33.3%,transparent calc(33.3% + .5px),transparent calc(66.6% - .5px),rgba(255,255,255,.5) 66.6%,transparent calc(66.6% + .5px))}
.cr-h{position:absolute;width:26px;height:26px;margin:-13px;background:transparent;display:block}
.cr-h::after{content:"";position:absolute;inset:7px;background:#fff;border:1px solid rgba(0,0,0,.45);border-radius:3px}
.cr-h[data-hx="-1"]{left:0}.cr-h[data-hx="0"]{left:50%}.cr-h[data-hx="1"]{left:100%}
.cr-h[data-hy="-1"]{top:0}.cr-h[data-hy="0"]{top:50%}.cr-h[data-hy="1"]{top:100%}
.cr-h[data-hx="-1"][data-hy="-1"],.cr-h[data-hx="1"][data-hy="1"]{cursor:nwse-resize}
.cr-h[data-hx="1"][data-hy="-1"],.cr-h[data-hx="-1"][data-hy="1"]{cursor:nesw-resize}
.cr-h[data-hy="0"]{cursor:ew-resize}.cr-h[data-hx="0"]{cursor:ns-resize}

.an-list,.ds-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.an-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.an-n{min-width:2.6em;text-align:right;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;font-size:14px}
.an-pl{font-size:13px}
.an-cnt{font-size:13px;font-weight:500;margin-left:10px}
.an-miss{margin-left:auto}
.ds-stats{display:flex;flex-wrap:wrap;gap:8px 22px}
.ds-stats div{display:grid;text-align:left}.ds-stats b{font-family:var(--display);font-size:26px;line-height:1.1}.ds-stats span{font-size:13px;color:var(--ink-2)}
.ds-row{display:flex;gap:4px;align-items:flex-start;padding-left:calc(var(--d,0)*20px)}
.ds-t{flex:none;width:28px;height:28px;border:0;background:transparent;color:var(--ink-2);font-size:15px;cursor:pointer;display:grid;place-items:center;border-radius:6px}
button.ds-t:hover{background:var(--surface-2)}
.ds-b{min-width:0;display:grid;gap:1px}.ds-s{font-size:12.5px;padding-left:6px}

/* Bok: valg, forhåndsvisning og utskrift */
.bookui{display:grid;gap:14px}
.bk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px 16px;margin-bottom:10px}
.bk-chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px;line-height:1.3;min-height:30px}
.bk-chk input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.bk-chk small{display:block;color:var(--ink-3);font-size:12.5px;font-weight:400}
.bk-sub{margin:0 0 12px 30px;display:grid;gap:8px}
.bk-sub.bk-grid{display:grid}
.bk-quick{display:flex;gap:6px;flex-wrap:wrap}
.bk-pick{display:grid;gap:10px;margin-top:12px}
.bk-list{display:grid;gap:2px;max-height:340px;overflow:auto;border:1px solid var(--line-2);border-radius:10px;padding:4px;background:var(--surface)}
.bk-row{display:flex;gap:10px;align-items:center;padding:4px 8px;border-radius:8px;cursor:pointer;min-height:40px}
.bk-row:hover{background:var(--surface-2)}
.bk-row input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.bk-row .n{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bookbar{position:sticky;bottom:calc(var(--nav-h,0px) + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:10px 12px;margin-top:14px;box-shadow:var(--shadow)}
.bookprev{--sc:1;margin-top:16px;background:#8d8a82;padding:12px;border-radius:12px;display:grid;gap:12px;justify-items:center;overflow:hidden}
.pgwrap{width:calc(210mm*var(--sc));height:calc(296.6mm*var(--sc));position:relative;box-shadow:0 2px 12px rgba(0,0,0,.35);background:#fff}
.pgwrap .page{position:absolute;left:0;top:0;transform:scale(var(--sc));transform-origin:0 0}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff!important}
  body.printing-book .top,body.printing-book #banner,body.printing-book .tabs,body.printing-book .bookui,body.printing-book .bookbar,body.printing-book .page-h,body.printing-book .toast{display:none!important}
  body.printing-book #app{padding:0;max-width:none;min-height:0}
  body.printing-book main{padding:0}
  body.printing-book .bookprev{margin:0;padding:0;background:none;display:block;border-radius:0;overflow:visible}
  body.printing-book .pgwrap{width:210mm;height:296.6mm;box-shadow:none;break-after:page;page-break-after:always;overflow:hidden}
  body.printing-book .pgwrap:last-child{break-after:auto;page-break-after:auto}
  body.printing-book .pgwrap .page{transform:none}
}

/* Bokside: hvitt A4-ark med faste mål, uavhengig av tema. */
.page{position:relative;width:210mm;height:296.6mm;background:#fff;color:#1c1b19;font-family:'Newsreader',Georgia,'Times New Roman',serif;font-size:10.5pt;line-height:1.42;overflow:hidden;box-sizing:border-box;padding:16mm 18mm 0 18mm;-webkit-print-color-adjust:exact;print-color-adjust:exact;text-align:left}
.page *{box-sizing:border-box}
.pg-body{width:174mm;height:259mm;overflow:hidden;position:relative}
.pg-foot{position:absolute;left:18mm;right:18mm;bottom:9mm;display:flex;justify-content:space-between;gap:10mm;font:8.5pt/1.2 'Schibsted Grotesk',system-ui,sans-serif;color:#77746c;border-top:.3mm solid #d9d5cb;padding-top:2mm}
.pg-foot span:last-child{font-variant-numeric:tabular-nums}
.bk-cover{height:259mm;display:flex;flex-direction:column;justify-content:center;gap:8mm;padding-bottom:20mm}
.bk-cover .rule{width:34mm;height:1.4mm;background:#8a5a3c}
.bk-cover h1{font:600 44pt/1.02 'Newsreader',Georgia,serif;letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
.bk-cover .sub{font:italic 400 17pt/1.3 'Newsreader',Georgia,serif;color:#4c4a45;margin:0}
.bk-cover .meta{font:9.5pt/1.5 'Schibsted Grotesk',system-ui,sans-serif;color:#77746c;margin:0}
.bk-h1{font:600 24pt/1.1 'Newsreader',Georgia,serif;letter-spacing:-.015em;margin:0 0 5mm;padding-bottom:3mm;border-bottom:.5mm solid #8a5a3c}
.bk-h2{font:600 19pt/1.12 'Newsreader',Georgia,serif;letter-spacing:-.01em;margin:0}
.bk-sec{font:600 7.5pt/1.2 'Schibsted Grotesk',system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#8a5a3c;margin:5mm 0 1.6mm}
.bk-ph{display:flex;gap:5mm;align-items:center;padding-top:2mm;margin-top:2mm;border-top:.3mm solid #d9d5cb}
.bk-ph.first{border-top:0;margin-top:0;padding-top:0}
.bk-ph .av{border:.3mm solid #d9d5cb;background:#efece4;color:#5a5750;box-shadow:none}
.bk-ph .t{min-width:0}
.bk-life{font:9.5pt/1.3 'Schibsted Grotesk',system-ui,sans-serif;color:#5a5750;margin-top:1mm;font-variant-numeric:tabular-nums}
.bk-facts{display:grid;grid-template-columns:24mm 1fr;gap:1mm 4mm;margin:2mm 0 0}
.bk-facts dt{font:600 8.5pt/1.5 'Schibsted Grotesk',system-ui,sans-serif;color:#77746c}
.bk-facts dd{margin:0;overflow-wrap:anywhere}
.bk-fam{display:grid;grid-template-columns:24mm 1fr;gap:1mm 4mm;margin:1mm 0 0}
.bk-fam b{font:600 8.5pt/1.5 'Schibsted Grotesk',system-ui,sans-serif;color:#77746c}
.bk-fam div{overflow-wrap:anywhere}
.pref{display:inline-block;margin-left:.3em;min-width:3.6em;font:8.5pt 'Schibsted Grotesk',system-ui,sans-serif;color:#77746c;white-space:nowrap}
.bk-ev{display:grid;grid-template-columns:13mm 1fr;gap:.6mm 3mm;margin:0}
.bk-ev .y{font:600 9pt/1.5 'Schibsted Grotesk',system-ui,sans-serif;color:#5a5750;text-align:right;font-variant-numeric:tabular-nums}
.bk-ev .s{font:8.5pt 'Schibsted Grotesk',system-ui,sans-serif;color:#77746c}
.bk-p{margin:0 0 2.4mm;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left}
.bk-srcrefs{font:9pt/1.45 'Schibsted Grotesk',system-ui,sans-serif;color:#3d3b36;margin:0}
.bk-srcrefs span.k{display:inline-block;min-width:6mm;font-weight:600;color:#8a5a3c}
.bk-toc{display:grid;grid-template-columns:1fr auto;gap:2.4mm 6mm;margin-top:4mm;font-size:12pt}
.bk-toc .n{font:600 10pt 'Schibsted Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:right;color:#5a5750}
.bk-toc .d{font:9pt 'Schibsted Grotesk',system-ui,sans-serif;color:#77746c;display:block;margin-top:.4mm}
.bk-fig{margin:0;min-width:0}
.bk-figs{display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin:0 0 5mm}
.bk-figs .box{height:70mm;display:grid;place-items:center;background:#f3f1ec;border:.3mm solid #e1ddd3;overflow:hidden}
.bk-figs img{max-width:100%;max-height:100%;display:block;object-fit:contain}
.bk-figs figcaption{font:8.8pt/1.35 'Schibsted Grotesk',system-ui,sans-serif;color:#3d3b36;margin-top:1.4mm;height:12mm;overflow:hidden}
.bk-figs figcaption b{font-weight:600}
.bk-src{margin:0 0 6mm;break-inside:avoid}
.bk-src .hd{display:flex;gap:3mm;align-items:baseline;margin-bottom:1.4mm}
.bk-src .hd .k{font:600 12pt 'Schibsted Grotesk',system-ui,sans-serif;color:#8a5a3c}
.bk-src .hd .t{font:600 11pt 'Newsreader',Georgia,serif}
.bk-src .who{font:9pt/1.4 'Schibsted Grotesk',system-ui,sans-serif;color:#5a5750;margin:0 0 2mm}
